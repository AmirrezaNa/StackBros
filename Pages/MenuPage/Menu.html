<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACK BROS! - Speisekarte</title>
    <link rel="shortcut icon" href="../../images/head-logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="Menu.css">
</head>

<body data-page-title="navMenu">
    <header class="header">
        <div class="logo">
            <img src="../../images/main-logo.jpg" alt="STACK BROS Logo" width="100">
            <h1>STACK BROS!</h1>
        </div>

        <nav class="navbar">
            <a href="../../index.html" data-i18n="navHome">Startseite</a>
            <a href="../MenuPage/Menu.html" data-i18n="navMenu">Speisekarte</a>
            <a href="../ContactUsPage/ContactUs.html" data-i18n="navContact">Kontakt</a>
        </nav>

        <div class="header-right">
            <a class="instagram-link"
                href="https://www.instagram.com/stackbross?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
                target="_blank" aria-label="Instagram">
                <img src="../../images/instagram-brands-solid.png" alt="Instagram">
            </a>
            <div class="language-switcher"></div>
        </div>
    </header>

    <section class="menu-hero">
        <h1 data-i18n="menuHeroTitle">Unsere Speisekarte</h1>
        <p data-i18n="menuHeroText">The Original STACK BROS - Frisch für dich gemacht.</p>
    </section>

    <main class="menu-section">
        <div class="menu-categories" aria-label="Speisekarte Kategorien">
            <button class="category-btn active" type="button" data-filter="all" data-i18n="all">Alle</button>
            <button class="category-btn" type="button" data-filter="burger" data-i18n="burgers">Burger</button>
            <button class="category-btn" type="button" data-filter="salat" data-i18n="salads">Salate</button>
            <button class="category-btn" type="button" data-filter="croque" data-i18n="croques">Croques</button>
            <button class="category-btn" type="button" data-filter="crepe" data-i18n="crepes">Crêpes</button>
        </div>

        <div id="menu-list"></div>
    </main>

    <div id="cart-modal" class="hidden">
        <div class="cart-content">
            <span class="close-cart" onclick="toggleCart()">&times;</span>
            <h2 data-i18n="yourCart">Dein Warenkorb</h2>
            <div id="cart-items"></div>
            <div class="cart-total">Total: <span id="cart-total-price">0.00</span> €</div>
            <button id="checkout-btn" onclick="prepareCheckout()" data-i18n="checkout">Zur Kasse</button>
        </div>
    </div>

    <div id="bottom-cart-bar" class="hidden" onclick="toggleCart()">
        <div class="cart-bar-left">
            <span id="cart-count">0</span> <span data-i18n="items">Artikel</span>
        </div>
        <div class="cart-bar-center" data-i18n="viewCart">
            Warenkorb ansehen
        </div>
        <div class="cart-bar-right">
            <span id="cart-bar-total">0,00</span> €
        </div>
    </div>

    <footer class="footer">
        <p data-i18n="rights">© 2026 STACK BROS. Alle Rechte vorbehalten.</p>
    </footer>

    <script src="../Language.js"></script>
    <script src="Menu.js"></script>
</body>
</html>
